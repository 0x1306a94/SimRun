# Build SimRun.app when a tag is pushed and attach it, zipped, to that tag's release (created if it doesn't exist yet).
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The app icon is an Icon Composer document, which needs Xcode 26 or later; use the newest Xcode on the runner.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Tags like v1.2 or 1.2.3 become the app's version; the run number becomes its build number.
      - name: Set version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ $VERSION =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" resources/Info.plist
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" resources/Info.plist

      - name: Build
        run: make core

      # ditto keeps the bundle's symlinks, extended attributes and code signatures intact.
      - name: Package
        run: ditto -c -k --keepParent build/SimRun.app "SimRun-$GITHUB_REF_NAME.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" "SimRun-$GITHUB_REF_NAME.zip" --clobber
